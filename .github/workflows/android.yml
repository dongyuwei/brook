# Build the Android VPN client and publish APKs to GitHub Releases.
#
# - Push to master: build only (artifacts on the Actions run page).
# - Pull request touching android/: build only.
# - Push a tag v*: build and attach APKs to a GitHub Release.
#
# Optional repo secrets for stable release signing (otherwise APKs are
# debug-signed and must be uninstalled before upgrading):
#   ANDROID_KEYSTORE_BASE64  base64 of a JKS keystore
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS        key alias
#   ANDROID_KEY_PASSWORD     key password (defaults to keystore password)
name: Android

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write # creating GitHub Releases on tag builds

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # x/mobile (gomobile) currently requires go >= 1.26; brook itself
          # only needs 1.24 and builds fine with a newer toolchain.
          go-version: "1.26.x"
          cache-dependency-path: android/mobile/go.sum

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Locate or install Android NDK
        run: |
          NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$NDK_DIR" ]; then
            yes | sdkmanager "ndk;27.2.12479018" > /dev/null
            NDK_DIR="$ANDROID_HOME/ndk/27.2.12479018"
          fi
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "Using NDK: $NDK_DIR"

      - name: Install gomobile
        run: |
          PIN=v0.0.0-20261011034528-197770444867
          go install golang.org/x/mobile/cmd/gomobile@$PIN
          go install golang.org/x/mobile/cmd/gobind@$PIN
          gomobile init

      - name: Build brook.aar
        run: android/build-aar.sh

      - name: Decode signing keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "BROOK_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "BROOK_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "BROOK_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "BROOK_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build APKs (universal + arm64)
        run: |
          cd android
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev.$GITHUB_RUN_NUMBER"
          fi
          ARGS=(-PversionName="$VERSION" -PversionCode="$GITHUB_RUN_NUMBER")

          # Both variants write to app-release.apk, so snapshot each one
          # before building the next.
          ./gradlew --no-daemon :app:assembleRelease "${ARGS[@]}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/BrookVPN-$VERSION-universal.apk"

          ./gradlew --no-daemon :app:assembleRelease "${ARGS[@]}" -Pabi=arm64-v8a
          cp app/build/outputs/apk/release/app-release.apk "dist/BrookVPN-$VERSION-arm64.apk"

          (cd dist && shasum -a 256 *.apk > SHA256SUMS)
          ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BrookVPN-apks
          path: |
            android/dist/*.apk
            android/dist/SHA256SUMS
          if-no-files-found: error

      # Rolling pre-release on every master push: the movable `pre-release`
      # tag is force-moved to HEAD and the release assets are replaced.
      # It does not match the v* tag trigger, so no workflow loop.
      - name: Roll pre-release tag
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f pre-release "$GITHUB_SHA"
          git push origin pre-release --force

      - name: Publish rolling pre-release
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pre-release
          name: "Pre-release (master)"
          prerelease: true
          make_latest: false
          body: |
            Automated build from master @ ${{ github.sha }}

            Install over previous pre-releases; downgrade to stable
            releases may require uninstalling first.
          files: |
            android/dist/*.apk
            android/dist/SHA256SUMS

      - name: Create GitHub Release with APKs
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/dist/*.apk
            android/dist/SHA256SUMS
          generate_release_notes: true
